[package]
name = "ryu-expenses"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Local-first Expense Tracker ledger and agent tools for Ryu."
repository = "https://github.com/amajorai/ryu"

[[bin]]
name = "ryu-expenses"
path = "src/main.rs"

[lib]
name = "ryu_expenses"
path = "src/lib.rs"

[dependencies]
ryu-sidecar-runtime = { path = "../crates/core/sidecar-runtime", version = "0.2.3" }
anyhow = "1"
axum = "0.7"
chrono = "0.4"
dirs = "5"
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
